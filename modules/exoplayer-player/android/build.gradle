apply plugin: 'com.android.library'

group = 'expo.modules.exoplayerplayer'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 26)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

android {
  namespace "expo.modules.exoplayerplayer"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Media3 (ExoPlayer), pinned here: this module sets the app's Media3
  // release. expo-audio asks for an older one (1.9.0) and Gradle resolves
  // each artifact to the highest version requested, so an artifact that is
  // not named here at this version falls back to expo-audio's. The
  // DASH/SmoothStreaming/RTSP artifacts are excluded globally via
  // plugins/withExcludeMedia3Dash.ts.
  def media3Version = safeExtGet('media3Version', '1.10.1')
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
  implementation "androidx.media3:media3-ui:${media3Version}"
  implementation "androidx.media3:media3-common:${media3Version}"
  constraints {
    // Not used by this module. expo-audio brings media3-session in at 1.9.0;
    // hold it at the player's release, where it has resolved until now.
    implementation("androidx.media3:media3-session:${media3Version}") {
      because "expo-audio asks for 1.9.0; keep media3-session on the player's Media3 release"
    }
  }

  // FFmpeg software decoders — DTS / TrueHD / AC-4 / WMA / older video
  // codecs that MediaCodec doesn't ship with on most Android TVs.
  //
  // This is the Jellyfin-published distribution of media3-decoder-ffmpeg
  // with prebuilt native libraries (the upstream androidx artifact is a
  // stub that requires building FFmpeg yourself).
  //
  // Version skew: this is built against media3 1.9.0 but media3 core
  // resolves to 1.10.1. Media3 maintains binary compat for Renderer /
  // RenderersFactory APIs across minor versions, so this works in
  // practice. Re-evaluate when Jellyfin publishes a 1.10.x build.
  implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.9.0+1"
}
