appId: tv.theweasel.weaselplex.phone
---
- launchApp
# The field is found by its label: API 36 exposes the label as the field's
# accessibility text, API 29 does not.
- tapOn:
    rightOf: "Server URL"
- eraseText: 60
- inputText: ${MAESTRO_WEASELPLEX_SERVER_URL}
- pressKey: Enter
- tapOn:
    text: ".*CONNECT.*"
    optional: true
