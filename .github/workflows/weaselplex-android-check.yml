# WeaselPlex Android compile check.
#
# WHY THIS EXISTS: Android-native WeaselPlex changes (Kotlin/JNI under
# modules/*/android) had no compile gate at all — Android was compiled only at
# release time on the VPS/ThinkCentre, with no pre-merge device gate. The iOS
# series had a TestFlight build on every PR and it caught a real compile error
# (PR #24) before a device ever saw it. This gives Android the same protection.
#
# WHERE IT RUNS: a GitHub-hosted Linux runner. This is the public streamyfin
# fork, so hosted minutes are free and no secrets are needed for a compile.
# It must NEVER run on the HostMyApple M4, which is iOS-only (Xcode, Simulator,
# TestFlight) — see AGENTS.md "Machine roles". Android native work outside
# Actions happens on the T3 VPS or the ThinkCentre via
# scripts/android/compile-check.sh, which is the same recipe.
#
# WHAT IT DOES: expo prebuild --platform android, then Gradle
# compileReleaseKotlin across every project (app + autolinked modules). No
# signing, no APK, no publish. Green means the Kotlin compiles; it is not a
# device test.
name: WeaselPlex Android compile check

on:
  pull_request:
    branches: [weaselfin]
  push:
    branches: [weaselfin]
  workflow_dispatch:
    inputs:
      ref:
        description: Which streamyfin ref to compile?
        required: false
        default: weaselfin
        type: string

permissions:
  contents: read

concurrency:
  group: weaselplex-android-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile Android Kotlin (app + native modules)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: BRAINSia/free-disk-space@7048ffbf50819342ac964ef3998a51c2564a8a75 # v2.1.3
        with:
          tool-cache: false
          android: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the native Android project
        env:
          EXPO_TV: "0"
          CI: "1"
        run: bunx expo prebuild --platform android --no-install

      - name: Compile Kotlin (app + every autolinked module)
        working-directory: android
        run: ./gradlew compileReleaseKotlin --no-daemon --console=plain

      - name: Report
        run: echo "COMPILE OK — $(git rev-parse --short HEAD)"
